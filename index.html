<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>墨水日志 · ink-tx</title>
<meta name='description' content='ink-tx 的个人博客：技术、工具与生活随笔。'>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg-soft:#161b22;--bg-card:#1c2330;
  --fg:#e6e9ef;--fg-dim:#9aa4b2;--fg-faint:#6b7686;
  --accent:#8ab4ff;--accent-2:#c792ea;--border:#2b3340;
  --serif:'Noto Serif SC','Songti SC','STSong',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif;
  --mono:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme='light']{
  --bg:#fafafa;--bg-soft:#fff;--bg-card:#fff;
  --fg:#1f2328;--fg-dim:#57606a;--fg-faint:#8b949e;
  --accent:#1a5fd4;--accent-2:#8250df;--border:#e5e7eb;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);line-height:1.85;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;font-family:var(--sans)}
.brand{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--fg)}
.brand em{color:var(--accent);font-style:normal}
nav a{color:var(--fg-dim);margin-left:22px;font-size:.92rem}
nav a:hover{color:var(--fg);text-decoration:none}
nav a.on{color:var(--accent)}
#themeBtn{cursor:pointer;border:1px solid var(--border);background:var(--bg-soft);color:var(--fg-dim);border-radius:99px;width:34px;height:34px;font-size:1rem;line-height:1}
#themeBtn:hover{color:var(--fg)}
main{min-height:70vh}
.hero{padding:88px 0 48px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,2.9rem);letter-spacing:.06em}
.hero h1 .dot{color:var(--accent)}
.hero p{color:var(--fg-dim);margin-top:14px;font-size:1.02rem}
.hero .line{width:56px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));margin:26px auto 0;border-radius:2px}
ul.posts{list-style:none;margin:12px 0 64px}
li.card{margin-bottom:18px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:26px 28px;transition:transform .18s,border-color .18s}
li.card:hover{transform:translateY(-2px);border-color:var(--accent)}
li.card .meta{font-family:var(--sans);font-size:.8rem;color:var(--fg-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
li.card h2{font-size:1.32rem;margin:8px 0 10px;line-height:1.45}
li.card h2 a{color:var(--fg)}
li.card h2 a:hover{color:var(--accent);text-decoration:none}
li.card p.excerpt{color:var(--fg-dim);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-family:var(--sans);font-size:.74rem;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:2px 10px}
article.post{padding:56px 0 40px}
article.post h1{font-size:1.9rem;line-height:1.4;margin-bottom:10px}
article.post .meta{font-family:var(--sans);color:var(--fg-faint);font-size:.86rem;padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:30px;display:flex;gap:10px}
article.post h2{font-size:1.32rem;margin:38px 0 14px;padding-left:12px;border-left:4px solid var(--accent)}
article.post p{margin:16px 0;color:var(--fg)}
article.post ul,article.post ol{margin:16px 0 16px 1.6em;color:var(--fg)}
article.post li{margin:6px 0}
article.post blockquote{margin:22px 0;padding:14px 20px;border-left:4px solid var(--accent-2);background:var(--bg-card);border-radius:0 10px 10px 0;color:var(--fg-dim)}
article.post code{font-family:var(--mono);font-size:.88em;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--accent-2)}
article.post pre{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:18px 20px;overflow-x:auto;margin:20px 0}
article.post pre code{background:none;border:none;padding:0;color:var(--fg)}
.pn{display:flex;justify-content:space-between;gap:16px;margin:44px 0 64px;font-family:var(--sans);font-size:.92rem}
.pn a{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;color:var(--fg-dim)}
.pn a:hover{border-color:var(--accent);color:var(--fg);text-decoration:none}
.pn a span{display:block;font-size:.76rem;color:var(--fg-faint);margin-bottom:4px}
.pn a.next{text-align:right}
h1.page-title{font-size:1.7rem;padding:52px 0 8px}
p.page-sub{color:var(--fg-dim);font-family:var(--sans);font-size:.92rem;margin-bottom:28px}
.arch-year{font-family:var(--sans);color:var(--fg-faint);margin:30px 0 10px;font-size:.85rem;letter-spacing:.1em}
ul.arch{list-style:none}
ul.arch li{display:flex;gap:18px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:1rem}
ul.arch time{font-family:var(--sans);color:var(--fg-faint);font-size:.84rem;white-space:nowrap;padding-top:4px}
.tagcloud{display:flex;flex-wrap:wrap;gap:12px;padding-bottom:60px}
.tagcloud a{font-family:var(--sans);background:var(--bg-card);border:1px solid var(--border);border-radius:99px;padding:8px 18px;font-size:.9rem;color:var(--fg-dim)}
.tagcloud a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.tagcloud a b{color:var(--accent);margin-left:6px}
.about-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:34px;margin:40px 0 64px}
.about-card p{margin:12px 0;color:var(--fg-dim)}
.about-card .links{margin-top:20px;font-family:var(--sans);font-size:.92rem;display:flex;gap:20px;flex-wrap:wrap}
footer.site{border-top:1px solid var(--border);margin-top:40px;padding:30px 0 44px;text-align:center;color:var(--fg-faint);font-family:var(--sans);font-size:.84rem}
footer.site a{color:var(--fg-dim)}
@media(max-width:560px){li.card{padding:20px}.hero{padding:60px 0 36px}article.post{padding:40px 0 24px}nav a{margin-left:14px}}
</style>
</head>
<body>
<header class='top'><div class='wrap'>
  <a class='brand' href='#/'>墨<em>·</em>ink-tx</a>
  <nav id='nav'>
    <a href='#/' data-r='/'>首页</a>
    <a href='#/archive' data-r='/archive'>归档</a>
    <a href='#/tags' data-r='/tags'>标签</a>
    <a href='#/about' data-r='/about'>关于</a>
  </nav>
  <button id='themeBtn' title='切换主题'>☾</button>
</div></header>
<main><div class='wrap' id='app'></div></main>
<footer class='site'><div class='wrap'>
  <p>© 2026 ink-tx · 由 <a href='https://pages.github.com'>GitHub Pages</a> 驱动 · 手工打造的单文件博客</p>
</div></footer>
<script>
var POSTS=[
 {slug:'hello-world',title:'你好，世界：我的博客开通了',date:'2026-01-15',tags:['随笔'],
  excerpt:'折腾了很久，终于把这个小角落搭建起来了。第一篇文章，聊聊为什么要写博客。',
  body:'<p>你好，陌生人。欢迎来到我的博客——或者对现在的你来说，它还只是一个空荡荡的房间。没关系，家具会一件一件搬进来的。</p><h2>为什么又开始写博客</h2><p>在算法信息流里，我们消费了太多、沉淀得太少。写博客是一种逆向操作：它强迫你把散装的想法压缩成结构化的文字，把「我好像懂了」变成「我能讲清楚」。</p><blockquote><p>写作不是为了被读到，而是为了想明白。</p></blockquote><h2>这里会有什么</h2><p>大概三类内容：</p><ul><li><strong>技术笔记</strong>：踩坑记录、源码阅读、小工具分享；</li><li><strong>效率工具</strong>：我工作流里那些真正省时间的玩意儿；</li><li><strong>生活切片</strong>：书影音，以及偶尔的碎碎念。</li></ul><h2>技术选型</h2><p>这个博客没有 Hexo、没有 Hugo、没有数据库——只有一个 <code>index.html</code>，文章直接写在脚本数组里，托管在 GitHub Pages 上。朴素，但足够快，也足够自由。</p><p>第一篇文章就到这里。下一篇，聊聊我的效率工具箱。</p>'},
 {slug:'my-toolbox-2026',title:'我的 2026 效率工具箱',date:'2026-02-03',tags:['工具','效率'],
  excerpt:'工欲善其事。盘点一下我日常使用频率最高的几款工具，以及它们各自解决了什么问题。',
  body:'<p>每隔一段时间整理一次工具箱是个好习惯——既能汰换掉吃灰的软件，也能重新审视自己的工作流。以下是我目前几乎每天都在用的东西。</p><h2>终端与编辑器</h2><ul><li><strong>终端</strong>：<code>wezterm</code> + zsh，快、跨平台、配置即代码；</li><li><strong>编辑器</strong>：Neovim 为主，VS Code 为辅。重活交给插件生态，轻量修改一把 <code>nvim</code> 秒开；</li><li><strong>会话</strong>：<code>tmux</code>，服务器和本机同构，断线不丢现场。</li></ul><h2>信息输入</h2><p>RSS 用 <code>Miniflux</code> 自建，阅读器用 <code>Reeder</code>。把「算法推荐」换成「主动订阅」之后，信息焦虑明显下降——你不再刷信息流，而是在读自己亲手挑的源头。</p><blockquote><p>工具的意义不是做得更多，而是让你忘了它们的存在。</p></blockquote><h2>笔记与写作</h2><p>笔记全部落在本地的 Markdown 文件里，用 <code>Obsidian</code> 建立链接，用 <code>git</code> 做版本管理。没有专有格式锁定，二十年后再拿出来也依然是纯文本。</p><p>工具不在多，在于每一件都能说出「它帮我省了什么」。你的工具箱里有什么舍不得换的？欢迎交流。</p>'},
 {slug:'single-file-blog',title:'零框架实战：在浏览器里手搓一个静态博客',date:'2026-02-20',tags:['技术','前端'],
  excerpt:'不用 Hexo、不用构建工具，一个 HTML 文件就能跑起一个带路由、标签和归档的博客。这篇文章记录它的实现思路。',
  body:'<p>这个博客本身就是一个前端小实验：一个 <code>index.html</code>，包含样式、数据和全部路由逻辑，托管在 GitHub Pages 上，零构建、零依赖。</p><h2>为什么是单文件</h2><p>静态生成器很好，但对于「只想写点东西」的需求来说，模板、插件、构建链都是额外的心智负担。单文件的哲学是：<strong>把复杂度压进浏览器的标准能力里</strong>。</p><h2>路由怎么做</h2><p>用 <code>location.hash</code> 做最朴素的前端路由：</p><pre><code>window.addEventListener("hashchange", render); // "/post/slug" → 文章页, "/archive" → 归档</code></pre><p>文章就是 JS 数组里的对象，字段只有 <code>slug / title / date / tags / body</code>，正文直接是 HTML 字符串，想插图就插图，自由度拉满。</p><h2>主题切换</h2><p>全部样式挂在 CSS 变量上，切换主题只需要改一行属性：</p><pre><code>document.documentElement.dataset.theme = "light";</code></pre><p>再配一个 <code>prefers-color-scheme</code> 的初始值和 <code>localStorage</code> 记忆，体验就完整了。</p><h2>部署</h2><p>推到 <code>username.github.io</code> 仓库的 <code>main</code> 分支，GitHub Pages 自动发布。改文章等于改数组、一次 commit，发布流程比任何 CMS 都短。</p><blockquote><p>最好的工具，是你愿意一直用下去的那一个。</p></blockquote>'}
];
var app=document.getElementById('app');
function metaHTML(p){return "<span>"+p.date+"</span><span>·</span><span>"+p.tags.map(function(t){return "<a href='#/tag/"+t+"'>"+t+"</a>"}).join(" / ")+"</span>"}
function tagChips(p){return p.tags.map(function(t){return "<a class='tag' href='#/tag/"+t+"'>"+t+"</a>"}).join("")}
function render(){
  var raw=location.hash.slice(1)||"/";
  var h=raw.replace(/\/+/g,"")||"/";
  document.querySelectorAll("#nav a").forEach(function(a){
    a.classList.toggle("on",a.dataset.r===h);
  });
  var html="",title="墨水日志 · ink-tx";
  if(h==="/"){
    html="<section class='hero'><h1>墨水<span class='dot'>·</span>日志</h1><p>记录技术、工具，与偶尔的生活。</p><div class='line'></div></section>"
      +"<ul class='posts'>"+POSTS.map(function(p){
        return "<li class='card'><div class='meta'><span>"+p.date+"</span>"+tagChips(p)+"</div><h2><a href='#/post/"+p.slug+"'>"+p.title+"</a></h2><p class='excerpt'>"+p.excerpt+"</p></li>";
      }).join("")+"</ul>";
  } else if(h.indexOf("/post/")===0){
    var slug=h.slice(6);
    var i=POSTS.findIndex(function(p){return p.slug===slug});
    if(i<0){html=notFound();} else {
      var p=POSTS[i],older=POSTS[i+1],newer=POSTS[i-1];
      title=p.title+" · 墨水日志";
      html="<article class='post'><h1>"+p.title+"</h1><div class='meta'>"+metaHTML(p)+"</div>"+p.body+"</article>"
      +"<nav class='pn'>"
      +(newer?"<a href='#/post/"+newer.slug+"'><span>← 较新一篇</span>"+newer.title+"</a>":"<a href='#/'><span>← 返回</span>首页</a>")
      +(older?"<a class='next' href='#/post/"+older.slug+"'><span>较旧一篇 →</span>"+older.title+"</a>":"<span></span>")
      +"</nav>";
    }
  } else if(h==="/archive"){
    var byYear={};
    POSTS.forEach(function(p){(byYear[p.date.slice(0,4)]=byYear[p.date.slice(0,4)]||[]).push(p)});
    html="<h1 class='page-title'>归档</h1><p class='page-sub'>共 "+POSTS.length+" 篇</p>"
     +Object.keys(byYear).sort().reverse().map(function(y){
       return "<div class='arch-year'>"+y+" 年</div><ul class='arch'>"+byYear[y].map(function(p){
         return "<li><time>"+p.date.slice(5)+"</time><a href='#/post/"+p.slug+"'>"+p.title+"</a></li>"}).join("")+"</ul>";
     }).join("");
  } else if(h==="/tags"){
    var c={};
    POSTS.forEach(function(p){p.tags.forEach(function(t){c[t]=(c[t]||0)+1})});
    html="<h1 class='page-title'>标签</h1><p class='page-sub'>按主题逛逛</p><div class='tagcloud'>"
     +Object.keys(c).sort().map(function(t){return "<a href='#/tag/"+t+"'>#"+t+"<b>"+c[t]+"</b></a>"}).join("")+"</div>";
  } else if(h.indexOf("/tag/")===0){
    var tag=h.slice(5);
    var list=POSTS.filter(function(p){return p.tags.indexOf(tag)>=0});
    title="#"+tag+" · 墨水日志";
    html="<h1 class='page-title'>#"+tag+"</h1><p class='page-sub'>"+list.length+" 篇文章</p><ul class='posts'>"
     +list.map(function(p){return "<li class='card'><div class='meta'><span>"+p.date+"</span>"+tagChips(p)+"</div><h2><a href='#/post/"+p.slug+"'>"+p.title+"</a></h2><p class='excerpt'>"+p.excerpt+"</p></li>"}).join("")+"</ul>";
  } else if(h==="/about"){
    html="<h1 class='page-title'>关于</h1><div class='about-card'>"
     +"<p>你好，我是 <strong>ink-tx</strong>（墨水）。一个喜欢折腾技术、工具与文字的人。</p>"
     +"<p>这个博客用来安放那些不适合发在社交媒体上的长内容：踩坑笔记、工具评测、读书随感，以及一些自言自语。</p>"
     +"<p>联系与合作，欢迎通过下面的方式找到我。</p>"
     +"<div class='links'><a href='https://github.com/ink-tx'>GitHub</a><a href='mailto:hi@example.com'>Email</a><a href='#/'>← 回首页</a></div></div>";
  } else { html=notFound(); }
  app.innerHTML=html;
  document.title=title;
  window.scrollTo(0,0);
}
function notFound(){return "<h1 class='page-title'>404</h1><p class='page-sub'>这页不存在。<a href='#/'>回首页 →</a></p>"}
window.addEventListener("hashchange",render);
var btn=document.getElementById("themeBtn");
var saved=localStorage.getItem("theme");
var prefersLight=window.matchMedia("(prefers-color-scheme: light)").matches;
applyTheme(saved||(prefersLight?"light":"dark"));
btn.onclick=function(){var t=document.documentElement.dataset.theme==="light"?"dark":"light";applyTheme(t);localStorage.setItem("theme",t)};
function applyTheme(t){document.documentElement.dataset.theme=t;btn.textContent=t==="light"?"☀":"☾"}
render();
</script>
</body>
</html>
