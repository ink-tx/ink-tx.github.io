<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</head>
<body data-page="{{ page.section | default: page.layout }}" data-base="{{ site.baseurl }}">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="墨水日志首页"><span class="brand-mark">墨</span><span>墨水日志<span class="brand-sub">ink-tx's notebook</span></span></a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}aria-current="page"{% endif %}>作业</a>
        <a href="{{ '/courses/' | relative_url }}" {% if page.section == 'courses' %}aria-current="page"{% endif %}>课程</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.section == 'archive' %}aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}>关于</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button theme-toggle" type="button" aria-label="切换到深色模式" title="切换主题"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.6 13.1A8.8 8.8 0 0 1 10.9 3.4 8.8 8.8 0 1 0 20.6 13.1Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <a class="write-link" href="{{ '/write/' | relative_url }}">写作业 <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </header>
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer container">
    <a class="footer-brand" href="{{ '/' | relative_url }}">墨水日志 <span>·</span> ink-tx</a>
    <p>认真记录，每一次从不懂到懂。</p>
    <div><a href="https://github.com/ink-tx/ink-tx.github.io">GitHub <span aria-hidden="true">↗</span></a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><span>© {{ site.time | date: '%Y' }}</span></div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
